name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typecheck, Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome CI check
        run: bunx biome ci .

      - name: Astro check
        run: bun run check

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Build site
        run: bun run build

      - name: Verify Wrangler bundle
        run: bunx wrangler deploy --dry-run

      - name: Smoke check built pages
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/robots.txt
          test -f dist/sitemap-index.xml
          bun --bun astro preview --port 4816 --host 127.0.0.1
          trap "bun --bun astro preview stop || true" EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4816/ >/dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:4816/ | grep -q "<html"
          curl -fsS http://127.0.0.1:4816/404.html | grep -q "404"
          curl -fsS http://127.0.0.1:4816/robots.txt | grep -q "Sitemap:"
          curl -fsS http://127.0.0.1:4816/sitemap-index.xml | grep -q "sitemap-0.xml"
