name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typecheck, Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome CI check
        run: bunx biome ci .

      - name: Astro check
        run: bun run check

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Build site
        run: bun run build

      - name: Verify Wrangler bundle
        run: bunx wrangler deploy --dry-run

      - name: Smoke check built site
        timeout-minutes: 5
        run: bash scripts/smoke.sh
